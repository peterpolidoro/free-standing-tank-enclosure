# What a picture draws each part of this project with (mechanical-cad, docs/layout-specification.md, "Finishes").
#
# A draft, written on 2026-11-19 from what the records already say and nothing else: a part has a finish here
# only where its name or the material CAD claims for it says what it is. Nobody has compared any of it with the
# parts on the bench. The colours are a drawing's, chosen to read as the material; they are not measured.
# A finish is not the record of what a part is made of: that is assembly/materials.json, where every row is
# still the CAD claim.
#
# There is no default on purpose. A part without a line under [parts] is drawn plain, and `make validate` says
# how many there are and which, so that what nobody has decided stays in view. Those parts are listed at the end.
schema_version = 1

[finishes.aluminium]
color = "#ced0d3"
metallic = 0.8
roughness = 0.55
note = "framing and machined plate; the numbers of the documentation renderer's aluminium"

[finishes.zinc]
color = "#a8abb0"
metallic = 0.9
roughness = 0.5
note = "what CAD claims for two framing parts; not checked"

[finishes.stainless]
color = "#bcbcbf"
metallic = 1.0
roughness = 0.28

[finishes.black-abs]
color = "#272729"
roughness = 0.48

[finishes.black-rubber]
color = "#1f1f20"
roughness = 0.9

[finishes.clear-acrylic]
color = "#e3f1f6"
roughness = 0.08
opacity = 0.25

[finishes.clear-plastic]
color = "#e3f1f6"
roughness = 0.08
opacity = 0.25
note = "the bowls: the brief says clear, the material is not chosen"

[finishes.envelope]
color = "#6fa3e0"
roughness = 0.6
opacity = 0.2
note = "a volume kept for something, not a thing"

