# Builds the documentation site from docs/ and deploys it to GitHub Pages.
# The manual under docs/manual/ is committed by assembly/publish_manual.py
# (the rendering pipeline does not run here), so the build is mkdocs alone, strict:
# a broken link fails it, as `make site` does locally.
# Pages must be set to "GitHub Actions" as its source in the repository
# settings for the deploy step to work.
# A push that does not touch the site's inputs does not rebuild it; run the
# workflow by hand (workflow_dispatch) to force a build.
name: pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs-material>=9.5,<10"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
